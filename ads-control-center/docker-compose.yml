services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dada}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dada}
      POSTGRES_DB: ${POSTGRES_DB:-dada_ads}
      TZ: Asia/Seoul
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dada} -d ${POSTGRES_DB:-dada_ads}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dada}:${POSTGRES_PASSWORD:-dada}@db:5432/${POSTGRES_DB:-dada_ads}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # 케이오 Excel 원본을 여기에 두고 /imports 로 적재한다 (읽기 전용).
      - ./data:/data:ro

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000/api/v1}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
