<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DADALAND · 내부 자료</title>
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:title" content="DADALAND 사내 자료">
<meta property="og:description" content="열람 권한이 있는 임직원만 접근할 수 있습니다.">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400&family=Noto+Sans+KR:wght@300;400;500;700&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Sans KR",sans-serif;background:#050A0C;
  background-image:radial-gradient(130% 120% at 12% 0%,#12312A 0%,#0A1C1B 45%,#050D11 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:#FBF7F0}
.box{width:100%;max-width:410px}
.brand{font-family:"Cormorant Garamond",serif;font-size:13px;letter-spacing:.42em;
  color:#C6A667;margin-bottom:34px}
h1{font-family:"Noto Serif KR",serif;font-weight:300;font-size:23px;line-height:1.5;margin-bottom:10px}
h1 b{color:#E4CE9C;font-weight:400}
.sub{font-size:12.5px;color:#8FA09B;line-height:1.85;font-weight:300;margin-bottom:30px}
label{display:block;font-size:11px;letter-spacing:.13em;color:#C6A667;margin-bottom:8px}
input{width:100%;padding:14px 15px;background:rgba(255,255,255,.05);
  border:1px solid rgba(198,166,103,.34);color:#FBF7F0;font-size:15px;
  font-family:inherit;outline:none;transition:.18s;-webkit-appearance:none;border-radius:0}
input:focus{border-color:#C6A667;background:rgba(255,255,255,.09)}
.row{margin-bottom:16px}
.two{display:flex;gap:10px}
.two .row{flex:1;margin-bottom:0}
button{width:100%;margin-top:22px;padding:15px;background:#C6A667;border:0;
  color:#0A1416;font-family:inherit;font-size:14.5px;font-weight:500;cursor:pointer;transition:.18s}
button:hover{background:#E4CE9C}
button:disabled{opacity:.5;cursor:wait}
.err{margin-top:15px;font-size:12.5px;color:#E88B7D;line-height:1.7;display:none}
.err.on{display:block}
.warn{margin-top:32px;padding-top:18px;border-top:1px solid rgba(198,166,103,.2);
  font-size:11px;color:#6F817C;line-height:1.9;font-weight:300}
.step{font-size:10.5px;letter-spacing:.2em;color:#5E706B;margin-bottom:14px}
</style>
</head>
<body>
<div class="box">
  <div class="brand">DADALAND</div>

  <div id="s1">
    <div class="step">STEP 1 / 2</div>
    <h1>사내 <b>대외비</b> 문서입니다.</h1>
    <div class="sub">열람 암호를 입력해 주세요.<br>암호는 사내 공지를 통해 안내됩니다.</div>
    <div class="row">
      <label>열람 암호</label>
      <input type="password" id="pw" autocomplete="off">
    </div>
    <button id="b1">확인</button>
    <div class="err" id="e1"></div>
  </div>

  <div id="s2" style="display:none">
    <div class="step">STEP 2 / 2</div>
    <h1>열람자 <b>본인 확인</b></h1>
    <div class="sub">열람 기록이 남습니다.<br>본인 정보로만 입력해 주세요.</div>
    <div class="row">
      <label>이름</label>
      <input type="text" id="nm" autocomplete="off">
    </div>
    <div class="row">
      <label>생년월일 6자리 (예: 900101)</label>
      <input type="tel" id="bd" maxlength="6" autocomplete="off" inputmode="numeric">
    </div>
    <button id="b2">문서 열기</button>
    <div class="err" id="e2"></div>
  </div>

  <div class="warn">
    본 문서는 주식회사 킴샵그룹 영업팀 전용 내부 자료입니다.
    무단 반출 · 사외 공유 시 취업규칙에 따른 징계 및 관계 법령에 따른
    민·형사상 책임을 물을 수 있습니다.
  </div>
</div>

var DATA=null;

function b2a(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})}
function hex(buf){return Array.from(new Uint8Array(buf)).map(function(x){
  return x.toString(16).padStart(2,"0")}).join("")}

function err(id,msg){var e=document.getElementById(id);e.textContent=msg;e.classList.add("on")}
function clr(id){document.getElementById(id).classList.remove("on")}

async function unlock(){
  clr("e1");
  var pw=document.getElementById("pw").value;
  if(!pw){err("e1","암호를 입력해 주세요.");return}
  var btn=document.getElementById("b1");btn.disabled=true;btn.textContent="확인 중...";
  try{
    var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey(
      {name:"PBKDF2",salt:b2a(SALT),iterations:ITER,hash:"SHA-256"},
      km,{name:"AES-GCM",length:256},false,["decrypt"]);
    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b2a(IV)},key,b2a(CT));
    DATA=JSON.parse(new TextDecoder().decode(pt));
    document.getElementById("s1").style.display="none";
    document.getElementById("s2").style.display="block";
    document.getElementById("nm").focus();
  }catch(e){
    err("e1","암호가 올바르지 않습니다.");
  }
  btn.disabled=false;btn.textContent="확인";
}

async function verify(){
  clr("e2");
  var nm=document.getElementById("nm").value.trim();
  var bd=document.getElementById("bd").value.trim();
  if(!nm||bd.length!==6){err("e2","이름과 생년월일 6자리를 입력해 주세요.");return}
  var btn=document.getElementById("b2");btn.disabled=true;btn.textContent="확인 중...";
  var d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(nm+"|"+bd+"|dadaland"));
  var k=hex(d);
  if(!DATA.roster[k]){
    err("e2","등록되지 않은 열람자입니다. 관리자에게 문의해 주세요.");
    btn.disabled=false;btn.textContent="문서 열기";return;
  }
  await log(nm);
  open_doc(nm, bd);
}

async function log(nm){
  if(!GAS) return;
  try{
    await fetch(GAS,{method:"POST",mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({doc:"2026단가표",name:nm,
        at:new Date().toISOString(),ua:navigator.userAgent,
        w:screen.width+"x"+screen.height})});
  }catch(e){}
}

function open_doc(nm){
  var now=new Date();
  var p=function(n){return String(n).padStart(2,"0")};
  var stamp=now.getFullYear()+"-"+p(now.getMonth()+1)+"-"+p(now.getDate())
            +" "+p(now.getHours())+":"+p(now.getMinutes());
  var mark=nm+" · "+stamp;

  var tile=encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="330" height="190">'+
    '<text x="165" y="95" fill="#1B3A30" fill-opacity="0.085" font-size="15" '+
    'font-family="sans-serif" text-anchor="middle" '+
    'transform="rotate(-28 165 95)">'+mark.replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</text></svg>');

  var wm='<style>'+
    '#__wm{position:fixed;inset:0;z-index:99999;pointer-events:none;'+
    'background-image:url("data:image/svg+xml,'+tile+'");background-repeat:repeat}'+
    '#__wmbar{position:fixed;left:0;right:0;bottom:0;z-index:99998;'+
    'background:#0A1C1B;color:#C6A667;font-family:"Noto Sans KR",sans-serif;'+
    'font-size:11px;padding:7px 14px;text-align:center;letter-spacing:.03em}'+
    '@media print{#__wm{position:absolute;height:100%}}'+
    'body{padding-bottom:34px}'+
    '</style>'+
    '<div id="__wm"></div>'+
    '<div id="__wmbar">사내 대외비 · 열람자 '+mark+' · 무단 반출 시 민·형사상 책임</div>';

  var html=DATA.html.replace("</body>", wm+"</body>");
  document.open();document.write(html);document.close();
}

document.getElementById("b1").addEventListener("click",unlock);
document.getElementById("b2").addEventListener("click",verify);
document.getElementById("pw").addEventListener("keydown",function(e){if(e.key==="Enter")unlock()});
document.getElementById("bd").addEventListener("keydown",function(e){if(e.key==="Enter")verify()});
document.getElementById("nm").addEventListener("keydown",function(e){if(e.key==="Enter")document.getElementById("bd").focus()});
document.getElementById("pw").focus();
</script>
